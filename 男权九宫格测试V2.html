            align-items: center;
        }

        }

            color: #2c3e50;
            margin-bottom: 20px;
        }

            background: #f8f9fa;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: left;
            margin: 20px auto;
            max-width: 600px;
        }

        #head li {
            margin: 10px 0;
            color: #495057;
        }

        /* 按钮通用样式 */
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        /* 问题界面样式 */
        #board {
            width: 100%;
            max-width: 600px;
        }

        #choiceForm {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        #num {

            color: #2c3e50;
            margin-bottom: 15px;
            display: block;
        }

        .option-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-option:hover {
            background: #e9ecef;
        }

        /* 九宫格样式优化 */
        .map {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 8px;
            margin: 20px 0;
        }

        .map div {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .map div:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #pointer {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.6);

            padding: 20px;
            border-radius: 10px;

            line-height: 1.6;
        }

            padding: 5px 15px;
            border-radius: 20px;
            margin: 0 10px;
